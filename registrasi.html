<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registration</title>
</head>

<body bgcolor="#eaf2f8">

    <center>
        <h1>FORM REGISTRATION</h1>
        <p>Silakan isi formulir pendaftaran berikut.</p>
    </center>

    <hr>

    <form action="#" method="post">

        <table width="600" align="center" border="1"
               cellpadding="10" cellspacing="0" bgcolor="white">

            <tr bgcolor="#d6eaf8">
                <th colspan="2">Formulir Pendaftaran</th>
            </tr>

            <tr>
                <td width="35%">NIM</td>
                <td>
                    <input type="text" name="nim"
                           size="30" maxlength="15"
                           placeholder="Masukkan NIM">
                </td>
            </tr>

            <tr>
                <td>Nama Lengkap</td>
                <td>
                    <input type="text" name="nama"
                           size="30" maxlength="50"
                           placeholder="Masukkan nama lengkap">
                </td>
            </tr>

            <tr>
                <td>Tempat, Tanggal Lahir</td>
                <td>
                    <input type="text" name="tempat_lahir"
                           size="30" placeholder="Contoh: Bandung">
                    <br><br>
                    <input type="text" name="tanggal_lahir"
                           size="30" placeholder="Contoh: 17-08-2005">
                </td>
            </tr>

            <tr>
                <td>Jenis Kelamin</td>
                <td>
                    <input type="radio" name="jenis_kelamin"
                           value="Laki-laki"> Laki-laki
                    <br>
                    <input type="radio" name="jenis_kelamin"
                           value="Perempuan"> Perempuan
                </td>
            </tr>

            <tr>
                <td>Agama</td>
                <td>
                    <select name="agama">
                        <option value="">-- Pilih Agama --</option>
                        <option value="Islam">Islam</option>
                        <option value="Kristen">Kristen</option>
                        <option value="Katolik">Katolik</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Buddha">Buddha</option>
                        <option value="Konghucu">Konghucu</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Program Studi</td>
                <td>
                    <select name="jurusan">
                        <option value="">-- Pilih Program Studi --</option>
                        <option value="Sistem Informasi">
                            Sistem Informasi
                        </option>
                        <option value="Komputerisasi Akuntansi">
                            Komputerisasi Akuntansi
                        </option>
                        <option value="Bisnis Digital">
                            Bisnis Digital
                        </option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Hobi</td>
                <td>
                    <input type="checkbox" name="hobi[]" value="Membaca">
                    Membaca
                    <br>
                    <input type="checkbox" name="hobi[]" value="Olahraga">
                    Olahraga
                    <br>
                    <input type="checkbox" name="hobi[]" value="Musik">
                    Musik
                    <br>
                    <input type="checkbox" name="hobi[]" value="Traveling">
                    Traveling
                </td>
            </tr>

            <tr>
                <td>Alamat</td>
                <td>
                    <textarea name="alamat" rows="4" cols="30"
                              placeholder="Masukkan alamat lengkap"></textarea>
                </td>
            </tr>

            <tr>
                <td>Nomor Telepon</td>
                <td>
                    <input type="text" name="telepon"
                           size="30" maxlength="15"
                           placeholder="Masukkan nomor telepon">
                </td>
            </tr>

            <tr>
                <td>Keterangan</td>
                <td>
                    <textarea name="keterangan" rows="4" cols="30"
                              placeholder="Tuliskan keterangan tambahan"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Daftar">
                    &nbsp;
                    <input type="reset" value="Ulangi">
                </td>
            </tr>

        </table>

    </form>

    <br>

    <center>
        <p>&copy; 2026 Form Registration - Latihan HTML</p>
    </center>

</body>
</html>
